spring:
  application:
    name: login-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/bubblebreath_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.bubblebreath.loginservice: DEBUG
    org.springframework.security: TRACE
    org.hibernate.SQL: DEBUG

# JWT Configuration
jwt:
  secret: 45A795FB2648596646E8245D8582736C5272F5594F17DA8245E2063CC3793081
  expiration: 86400000 # 24 hours in ms
